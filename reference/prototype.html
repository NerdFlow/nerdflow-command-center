<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NerdFlow Sales Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--bg:#F5FAF8;--panel:#FFFFFF;--panel2:#E8F2EE;--ink:#050807;--muted:#42524C;--rule:#D5E3DD;--signal:#087A57;--signal-soft:#D8FAED;--go:#087A57;--go-soft:#D8FAED;--stop:#B4432F;--stop-soft:#F8E1DC;--accent:#20B982;--accent-hover:#087A57;--accent-soft:#D8FAED;--on-accent:#050807;--sans:"Sora",system-ui,-apple-system,"Segoe UI",sans-serif;--voice:var(--sans)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050807;--panel:#0B1210;--panel2:#121A17;--ink:#FFFFFF;--muted:#B8C9C2;--rule:#1D2925;--signal:#72ECC0;--signal-soft:#10251D;--go:#34E0A1;--go-soft:#10251D;--stop:#F08A74;--stop-soft:#2E1712;--accent:#34E0A1;--accent-hover:#20B982;--accent-soft:#10251D;--on-accent:#050807}}
:root[data-theme="dark"]{--bg:#050807;--panel:#0B1210;--panel2:#121A17;--ink:#FFFFFF;--muted:#B8C9C2;--rule:#1D2925;--signal:#72ECC0;--signal-soft:#10251D;--go:#34E0A1;--go-soft:#10251D;--stop:#F08A74;--stop-soft:#2E1712;--accent:#34E0A1;--accent-hover:#20B982;--accent-soft:#10251D;--on-accent:#050807}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.55;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}::selection{background:var(--accent);color:#050807}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.rail{border-right:1px solid var(--rule);padding:22px 14px;display:flex;flex-direction:column;gap:4px;background:var(--panel)}
.brand{padding:4px 10px 22px}.brand img{display:block;width:100%;max-width:180px;height:auto}.brand .l-dark{display:none}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .brand .l-light{display:none}:root:not([data-theme="light"]) .brand .l-dark{display:block}}:root[data-theme="dark"] .brand .l-light{display:none}:root[data-theme="dark"] .brand .l-dark{display:block}.brand small{display:block;font-size:12px;color:var(--muted);margin-top:8px}

.nav{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:8px;color:var(--muted)}
.nav:hover{background:var(--bg);color:var(--ink)}
.nav.on{background:var(--accent-soft);color:var(--ink);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.badge{font-size:12px;background:var(--accent);color:var(--on-accent);border-radius:20px;padding:0 8px;font-weight:600}
.who{margin-top:auto;padding:14px 10px 0;border-top:1px solid var(--rule)}
.who label,.lbl{font-size:13px;color:var(--muted);display:block}
.who select,.who input{width:100%;margin-top:4px;padding:7px 8px;border:1px solid var(--rule);border-radius:8px;background:var(--bg)}
main{padding:32px clamp(16px,4vw,48px) 110px;max-width:1060px;width:100%}
h1{font-size:28px;line-height:1.15;margin:0 0 6px;letter-spacing:-.02em}
h2{font-size:17px;margin:0 0 12px}
h3{font-size:15px;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 26px}
.voice{display:flex;gap:14px;align-items:flex-start;margin:0 0 28px}

rgin-top:2px}
.orb.sm{width:28px;height:28px;border-radius:8px;background-size:21px auto;margin:0}
.orb{background-color:#050807;border:1px solid var(--rule)}.orb.think{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px var(--accent-soft),0 0 0 7px var(--accent)}}
@media (prefers-reduced-motion:reduce){.orb{background-color:#050807;border:1px solid var(--rule)}.orb.think{animation:none}}
.voice p{font-family:var(--sans);font-size:19px;line-height:1.55;margin:0;max-width:68ch;white-space:pre-line}
.voice .name{font-size:12px;color:var(--signal);font-weight:600;display:block;margin-bottom:2px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:18px 20px}
.bar{height:8px;background:var(--bg);border-radius:8px;overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:8px}.bar{background:var(--panel2)}
.bar i.done{background:var(--go)}
.row{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{border:1px solid var(--rule);background:var(--panel);padding:8px 14px;border-radius:8px}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}.btn.primary:hover:not(:disabled){background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.go{background:var(--go-soft);border-color:var(--go);color:var(--go);font-weight:600}
.btn.stop{color:var(--stop)}
.btn.sm{padding:5px 10px;font-size:13px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-block;font-size:12px;padding:2px 9px;border-radius:20px;background:var(--bg);color:var(--muted);margin:0 6px 6px 0}
.chip.hot{background:var(--signal-soft);color:var(--signal);font-weight:600}
.chip.go{background:var(--go-soft);color:var(--go)}
.chip.stop{background:var(--stop-soft);color:var(--stop)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.queue{list-style:none;margin:0;padding:0}
.queue li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--rule)}
.queue li:last-child{border:0}
.focus{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}
.channel{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:2px 0 4px}
.why{font-size:15px;color:var(--muted);margin:0 0 14px}
textarea,.in{width:100%;padding:10px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--bg);line-height:1.5}
textarea{min-height:190px;resize:vertical}
.steps{display:flex;gap:6px;margin:10px 0 16px;flex-wrap:wrap}
.steps span{font-size:12px;padding:3px 9px;border-radius:6px;border:1px solid var(--rule);color:var(--muted)}
.steps span.now{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:600}
.steps span.past{text-decoration:line-through;opacity:.6}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:500;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--rule)}
td{padding:9px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.tablewrap{overflow-x:auto}
.score{font-weight:700;font-size:20px}
.alert{border:1px solid var(--stop);background:var(--stop-soft);border-radius:10px;padding:12px 14px;margin:10px 0}
.coach{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent);border-radius:10px;padding:12px 14px;margin:0 0 14px}
.coach b{display:block;font-size:13px;color:var(--signal)}
details{border-top:1px solid var(--rule);padding:8px 0}
details summary{cursor:pointer;font-size:14px;font-weight:500}
.toast{position:fixed;right:20px;top:20px;max-width:380px;background:var(--ink);color:var(--panel);padding:14px 16px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:30;font-size:14px}
.toast b{display:block;margin-bottom:2px}
.hbars .hb{display:grid;grid-template-columns:90px 1fr 54px;gap:10px;align-items:center;font-size:14px;margin:6px 0}
.empty{padding:26px;text-align:center;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);margin:0 0 18px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;color:var(--muted);white-space:nowrap}
.tab.on{border-color:var(--accent);color:var(--ink);font-weight:600}
.wsteps{display:flex;gap:8px;margin:0 0 22px;flex-wrap:wrap}
.wsteps span{font-size:13px;color:var(--muted)}
.wsteps span.on{color:var(--ink);font-weight:600}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.pick button{text-align:left;background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:14px 16px}
.pick button.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.field{margin:0 0 14px}
.field .in,.field textarea{margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
pre.spec{background:var(--bg);border:1px solid var(--rule);border-radius:8px;padding:12px;overflow-x:auto;font-size:12.5px;white-space:pre}
.doc{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule);font-size:14px}
.fab{position:fixed;right:20px;bottom:20px;z-index:20;display:flex;align-items:center;gap:10px;background:var(--accent);color:var(--on-accent);border:0;border-radius:40px;padding:10px 18px 10px 12px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(420px,100%);background:var(--panel);border-left:1px solid var(--rule);z-index:25;display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(0,0,0,.12)}

 if(/hostco/i.test(prod.name))return{
  summary:`Reach short-term rental operators in ${loc} facing enforcement pressure, and recruit design partners for HostCo.`,

   linkedin:{first:`Hi {name}, saw {biz} runs a solid portfolio in {city}. With enforcement tightening there, curious how you keep guests inside the rules. We built HostCo, where the AI answering your guests also enforces the house rules. Worth a chat?`,follow:`Hi {name}, quick one. Is guest compliance something on your radar this quarter, or all under control?`},
   email:{first:`Subject: {biz} and {city} STR rules\n\nHi {name},\n\nCompliance trackers tell you the rules. Guest messaging tools answer your guests. HostCo is the one where the thing answering your guests is also enforcing the rules.\n\nWe're picking three {city} operators as design partners, with early pricing and direct input on the product. Open to a 15-minute call?\n\n{me}`,follow:`Subject: Closing the loop\n\nHi {name},\n\nI'll stop here so I'm not cluttering your inbox. If guest compliance becomes a headache later, just reply to this and we'll pick it up.\n\n{me}`}},
  objections:[{q:'We already use Guesty or another PMS.',a:'Good, HostCo sits on top of it. It is not a replacement, it is the layer that enforces rules in guest conversations.'},{q:'Our team handles guest messages fine.',a:'Ask what happens at 2am or when a guest pushes a party. Consistency at scale is the pitch, not replacing people.'},{q:'We have not had compliance issues.',a:'Then lead with speed and 24/7 replies, and keep compliance as the insurance angle.'}],
  leadGen:{sources:['City STR license registries','Airbnb host profiles','LinkedIn'],searchQueries:[`${loc} short term rental permit registry`,`vacation rental management company ${loc}`,`Airbnb property manager ${loc}`],mustHave:['20+ listings','Named decision-maker','Operates in the target city'],scoreBoost:['Posted about regulations recently','Hiring guest communication staff']},
  killRule:'Pause at 150 touches if reply rate is under 1% or bounce rate is over 5%.'};
 return{
  summary:`Reach ${f&&f.audience||'the right buyers'} in ${loc} with a clear offer for ${prod.name} and book short intro calls.`,
  icp:{buyer:f&&f.audience||'Founder or head of operations',business:'Businesses that match the product description',location:loc,size:'10 to 200 employees',triggers:['Hiring for the role this replaces','Recent funding or expansion','Public complaints about the problem'],disqualifiers:['Already using a direct competitor','Too small to afford it']},
  channels:[{ch:'email',why:'Scales well and carries detail.'},{ch:'linkedin',why:'Reaches decision-makers directly and adds a human face.'}],
  cadence:[{d:0,ch:'email',purpose:'Open with their problem and one clear ask.',tip:'Write about them for three sentences before you mention yourself.'},{d:3,ch:'linkedin',purpose:'Connect with a short personal note.',tip:'Reference something they posted or their company did.'},{d:6,ch:'email',purpose:'Follow-up that adds a new angle.',tip:'Add one proof point or example. Never just bump.'},{d:10,ch:'linkedin',purpose:'Easy yes or no question.',tip:'Make replying take five seconds.'},{d:14,ch:'email',purpose:'Polite close-the-loop email.',tip:'Stopping politely often earns the reply.'}],
  messages:{email:{first:`Subject: Quick question for {biz}\n\nHi {name},\n\n${prod.summary||'We help businesses like yours.'}\n\nWould a 15-minute call this week be useful?\n\n{me}`,follow:`Subject: Re: {biz}\n\nHi {name},\n\nFollowing up with one example of how this works in practice. Happy to share it on a quick call.\n\n{me}`},linkedin:{first:`Hi {name}, came across {biz} and had a quick idea about ${prod.name}. Open to connecting?`,follow:`Hi {name}, is this worth a 10-minute chat, or not a priority right now?`}},
  objections:[{q:'Not a priority right now.',a:'Ask when it would be, and set the follow-up date together.'},{q:'Send me more information.',a:'Send it, and ask what they would need to see to decide.'}],
  leadGen:{sources:['LinkedIn','Apollo','Company websites'],searchQueries:[`${f&&f.audience||'companies'} ${loc}`],mustHave:['Named decision-maker','Verified email'],scoreBoost:['Recent hiring or funding']},

function normalize(st,prod,f){
 const fb=fallbackStrategy(prod,f);if(!st||typeof st!=='object')return fb;
 const o={summary:st.summary||fb.summary,icp:Object.assign({},fb.icp,st.icp||{}),killRule:st.killRule||fb.killRule};
 ['triggers','disqualifiers'].forEach(k=>{if(!Array.isArray(o.icp[k]))o.icp[k]=fb.icp[k]});
 o.channels=(Array.isArray(st.channels)?st.channels:[]).filter(x=>x&&CHS.includes(x.ch)).slice(0,3);if(!o.channels.length)o.channels=fb.channels;
 const chosen=o.channels.map(x=>x.ch);
 o.cadence=(Array.isArray(st.cadence)?st.cadence:[]).filter(x=>x&&chosen.includes(x.ch)).map(x=>({d:Math.max(0,parseInt(x.d)||0),ch:x.ch,purpose:x.purpose||'',tip:x.tip||''})).sort((a,b)=>a.d-b.d);
 if(o.cadence.length<2)o.cadence=fb.cadence.filter(x=>chosen.includes(x.ch));if(!o.cadence.length)o.cadence=fb.cadence;
 o.messages={};chosen.forEach(ch=>{const m=st.messages&&st.messages[ch];o.messages[ch]={first:(m&&m.first)||(fb.messages[ch]&&fb.messages[ch].first)||fallbackStrategy({name:'x',summary:prod.summary},f).messages.email.first,follow:(m&&m.follow)||(fb.messages[ch]&&fb.messages[ch].follow)||'Hi {name}, following up on my last note. Worth a quick chat?'}});
 o.objections=Array.isArray(st.objections)&&st.objections.length?st.objections.filter(x=>x&&x.q):fb.objections;
 o.leadGen=Object.assign({},fb.leadGen,st.leadGen||{});['sources','searchQueries','mustHave','scoreBoost'].forEach(k=>{if(!Array.isArray(o.leadGen[k]))o.leadGen[k]=fb.leadGen[k]});
 return o;
}

 ];
 const mk=(id,pid,name,city,owner,stats,meetings,bounce,status,daysAgo)=>({id,productId:pid,name,city,owner,status,stats,meetings,bounce,goal:pid==='p1'?'Book demos from missed-call audits':'Recruit design partners',createdAt:Date.now()-daysAgo*864e5,strategy:fallbackStrategy(products.find(p=>p.id===pid),{location:city}),docs:[],notes:[{by:owner,at:Date.now()-daysAgo*864e5,text:'Campaign launched.'}]});
 const campaigns=[
  mk('c1','p1','Houston restaurants: missed-call audit','Houston','hadi',{call:{s:61,r:4},instagram:{s:38,r:3},email:{s:113,r:2}},2,2,'active',21),
  mk('c2','p1','Chicago pizzerias: Friday rush','Chicago','hadi',{instagram:{s:30,r:2},email:{s:44,r:1}},0,3,'active',9),

 ];
 campaigns[1].strategy.channels=campaigns[1].strategy.channels.filter(x=>x.ch!=='call');campaigns[1].strategy.cadence=campaigns[1].strategy.cadence.filter(x=>x.ch!=='call');
 campaigns[3].notes.push({by:'jarvis',at:Date.now()-864e5,text:'Paused automatically: 152 sends, 0 replies, 11% bounce. List problem, not a message problem.'});
 campaigns[0].notes.push({by:'hadi',at:Date.now()-3*864e5,text:'Calls between 7 and 8pm Friday get the most unanswered results. Audit emails referencing the exact time get more replies.'});
 return{view:'today',user:'hadi',aiName:'Jarvis',openCamp:null,tab:'overview',streak:{hadi:3,baryal:1},closed:{},chat:{hadi:[],baryal:[]},
 targets:{hadi:{leads:30,emails:40,calls:15,dms:10},baryal:{leads:20,emails:30,linkedin:15}},
 done:{hadi:{leads:18,emails:14,calls:5,dms:3,replies:1,meetings:0},baryal:{leads:9,emails:11,linkedin:4,replies:0,meetings:0}},

 products,campaigns,

 ],

let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!S||!S.products)S=seed();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Storage full','Large uploads may not be saved in this prototype.')}}
const camp=id=>S.campaigns.find(c=>c.id===id);
const prodOf=c=>S.products.find(p=>p.id===c.productId)||{name:'Unknown',summary:''};

const live=c=>c&&c.status==='active';

/* ---------- AI ---------- */
let sampleFn=null;
async function getSample(){if(sampleFn)return sampleFn;try{if(window.claude&&window.claude.use)sampleFn=await window.claude.use('sample')}catch(e){}return sampleFn}
setTimeout(getSample,50);
async function ai(input,onText,tier){const s=await getSample();if(!s)return null;try{const r=await s(input,{modelTier:tier||'quick',cache:false,onText:onText?({text})=>onText(text):undefined});return r.text}catch(e){return e&&e.text?e.text:null}}
async function aiJSON(prompt){const s=await getSample();if(!s)return null;try{return await s.json(prompt,{modelTier:'default',cache:false})}catch(e){try{const r=await s(prompt,{modelTier:'default',cache:false});return JSON.parse(r.text.replace(/```json|```/g,'').trim())}catch(e2){return null}}}
function persona(){return `You are ${S.aiName}, the AI sales chief of staff inside NerdFlow's sales command center. NerdFlow is a Pakistan-based software and AI company selling to US and international clients. The two people using you, Hadi (CSO) and Baryal, are not trained salespeople: you are here to turn them into good ones. Always explain the why behind advice in one short line so they learn, not just follow. Voice: calm, specific, dry wit, never a cheerleader, never generic. Short sentences, plain text, no markdown headers, no emoji. Never invent statistics, customer names, or results.`}
function knowledge(c){const p=prodOf(c);return (`PRODUCT: ${p.name}\n${p.summary}\n`+p.docs.map(d=>`--- ${d.name}\n${d.text}`).join('\n')+(c.docs||[]).map(d=>`--- Campaign doc: ${d.name}\n${d.text}`).join('\n')).slice(0,14000)}

/* ---------- Cadence + routing ---------- */
function avail(l,ch,isFirst){if(ch==='email')return!!l.sig.email;if(ch==='instagram')return!!l.sig.ig;if(ch==='linkedin')return!!l.sig.li;if(ch==='call')return isFirst?!!l.sig.phone:true;return false}
function sequence(l){
 const c=camp(l.camp),st=c.strategy,seq=[];
 const order=st.channels.map(x=>x.ch);
 const best=order.find(ch=>avail(l,ch,true))||(l.sig.email?'email':order[0]);
 const firstStep=st.cadence.find(x=>x.d===0&&x.ch===best)||{d:0,ch:best,purpose:(st.channels.find(x=>x.ch===best)||{}).why||'First touch.',tip:(st.cadence[0]||{}).tip||''};
 seq.push(firstStep);
 st.cadence.filter(x=>x.d>0&&avail(l,x.ch,false)).forEach(x=>{if(seq[seq.length-1].ch!==x.ch)seq.push(x)});
 return seq;
}
function why(l,step){
 if(l.opens>=2)return `Hot: ${l.note||'engaged with your last touch.'} Strike while they remember you.`;
 const ch=step.ch;
 if(l.step===0){const w=(camp(l.camp).strategy.channels.find(x=>x.ch===ch)||{}).why;return (l.note?l.note+' ':'')+(w||'')}
 return step.purpose||`Follow-up ${l.step}. Most replies arrive on the second or third touch.`;
}
function queueFor(u){return S.leads.filter(l=>{const c=camp(l.camp);return c&&c.owner===u&&!l.status&&!(l.due>0)&&live(c)}).sort((a,b)=>(b.opens||0)-(a.opens||0)||(a.skip?1:0)-(b.skip?1:0)||b.step-a.step)}
function fill(t,l){const name=(l.contact.split(',')[0]||'').replace(/owner unknown.*/i,'there').trim()||'there';return String(t||'').replace(/\{name\}/g,name).replace(/\{biz\}/g,l.biz).replace(/\{city\}/g,l.city).replace(/\{me\}/g,first(S.user)).replace(/\{product\}/g,prodOf(camp(l.camp)).name)}
function draftFor(l,step){const m=camp(l.camp).strategy.messages[step.ch]||{};return fill(l.step>0?(m.follow||m.first):m.first,l)}

/* ---------- Scoring ---------- */
function score(it){
 const c=camp(it.camp);let s=0;const flags=[],good=[];
 if(!c)return{score:0,flags:['Unknown campaign'],good};
 if(it.city&&c.city&&it.city.toLowerCase()===c.city.toLowerCase()){s+=30;good.push('Campaign city')}else flags.push(`Outside campaign city (${c.city})`);
 if(it.contact&&!/unknown/i.test(it.contact)){s+=20;good.push('Named decision-maker')}else flags.push('No named decision-maker');
 if(it.sig.email){s+=20;good.push('Verified email')}
 const sigs=[it.sig.ig&&'Active Instagram',it.sig.li&&'LinkedIn',it.sig.phone&&'Missed peak-hour call'].filter(Boolean);s+=Math.min(30,sigs.length*15);good.push(...sigs);
 if(!it.sig.email&&!it.sig.ig&&!it.sig.li&&!it.sig.phone){s-=30;flags.push('No reachable channel')}
 const m=/\((\d+) units\)/.exec(it.contact||'');if(m&&+m[1]<20)flags.push('Under 20 units');
 return{score:Math.max(0,Math.min(100,s)),flags,good};
}

 s+=`\nYou're at ${p}% of today's targets${S.streak[u]?`, on a ${S.streak[u]}-day streak`:''}.`;return s;
}

  ${isNew?`<div class="two" style="margin-top:16px"><div class="field"><span class="lbl">Name</span><input class="in" id="np_name" value="${esc(W.newProd.name)}" placeholder="e.g. Custom AI CRM builds"></div><div class="field"><span class="lbl">Type</span><select class="in" id="np_type"><option ${W.newProd.type==='Product'?'selected':''}>Product</option><option ${W.newProd.type==='Service'?'selected':''}>Service</option></select></div></div><div class="field"><span class="lbl">What it does, in plain words</span><textarea id="np_sum" style="min-height:90px" placeholder="Who it helps, what problem it solves, rough pricing if you know it.">${esc(W.newProd.summary)}</textarea></div>`:`<p class="small" style="margin:16px 0 0">${esc(p.summary)}</p>`}
  <div class="field" style="margin-top:16px"><span class="lbl">Upload anything useful: pitch decks as text, pricing, past proposals, case studies, call notes (.txt, .md, .csv)</span><input type="file" id="wizfile" multiple accept=".txt,.md,.csv,.json" class="in"></div>
  <div class="field"><span class="lbl">Or paste information</span><textarea id="wizpaste" style="min-height:90px" placeholder="Paste a pitch, a proposal, a case study, anything."></textarea></div>
  ${W.docs.length?`<div style="margin-bottom:10px">${W.docs.map(d=>`<span class="chip go">${esc(d.name)}</span>`).join('')}</div>`:''}
  <div class="actions"><button class="btn primary" id="wiz1">Next</button></div></section>`}
 if(W.step===2)return hdr+`<section class="panel"><h2>Tell ${esc(S.aiName)} about this campaign</h2><p class="muted small" style="margin:0 0 14px">Not sure? Leave it blank. ${esc(S.aiName)} will propose and explain.</p>
  <div class="two"><div class="field"><span class="lbl">Who do you think buys this?</span><input class="in" id="w_aud" value="${esc(W.audience)}" placeholder="e.g. Owners of independent restaurants"></div><div class="field"><span class="lbl">Where? Pick one city or region</span><input class="in" id="w_loc" value="${esc(W.location)}" placeholder="e.g. Houston"></div></div>
  <div class="two"><div class="field"><span class="lbl">What counts as a win?</span><input class="in" id="w_goal" value="${esc(W.goal)}" placeholder="e.g. 10-minute demo calls"></div><div class="field"><span class="lbl">Owner</span><select class="in" id="w_owner">${Object.entries(PEOPLE).map(([k,v])=>`<option value="${k}" ${W.owner===k?'selected':''}>${v}</option>`).join('')}</select></div></div>
  <div class="field"><span class="lbl">Anything else you know? Hunches, past attempts, competitors</span><textarea id="w_notes" style="min-height:90px">${esc(W.notes)}</textarea></div>
  <div class="actions"><button class="btn" id="wizback">Back</button><button class="btn primary" id="wiz2">Build the strategy</button></div></section>`;
 if(W.step===3)return hdr+voice(`Reading everything you gave me about ${W.prodName}. Working out who buys it, why now, where to reach them, and what to say.`,'w')+`<p class="muted small" style="margin-left:48px">This usually takes under a minute.</p>`;
 const st=W.strategy;
 return hdr+voice(`Here's the plan. I kept it to ${st.channels.length} channels and a ${st.cadence.length}-touch cadence so it stays doable. Change anything, or tell me what to rethink.`)+`
 <section class="panel" style="margin-bottom:16px"><div class="two"><div class="field"><span class="lbl">Campaign name</span><input class="in" id="r_name" value="${esc(W.name)}"></div><div class="field"><span class="lbl">Location</span><input class="in" id="r_loc" value="${esc(st.icp.location)}"></div></div><div class="field"><span class="lbl">The plan in one paragraph</span><textarea id="r_sum" style="min-height:70px">${esc(st.summary)}</textarea></div></section>
 <div class="grid g2" style="margin-bottom:16px"><section class="panel"><h2>Ideal customer</h2><p class="small" style="margin:0 0 8px"><strong>Buyer:</strong> ${esc(st.icp.buyer)}<br><strong>Business:</strong> ${esc(st.icp.business)}<br><strong>Size:</strong> ${esc(st.icp.size)}</p><span class="lbl">Buying triggers</span><div style="margin:4px 0 8px">${st.icp.triggers.map(t=>`<span class="chip go">${esc(t)}</span>`).join('')}</div><span class="lbl">Skip if</span><div style="margin-top:4px">${st.icp.disqualifiers.map(t=>`<span class="chip stop">${esc(t)}</span>`).join('')}</div></section>
 <section class="panel"><h2>Channels</h2>${st.channels.map(ch=>`<p class="small" style="margin:0 0 8px"><strong>${CH[ch.ch]}</strong>: ${esc(ch.why)}</p>`).join('')}<h2 style="margin-top:14px">Lead generation</h2><div>${list(st.leadGen.sources)}</div><p class="muted small" style="margin:6px 0 0">Must have: ${esc(st.leadGen.mustHave.join(', '))}</p></section></div>
 <section class="panel tablewrap" style="margin-bottom:16px"><h2>Cadence</h2><table><thead><tr><th>Day</th><th>Channel</th><th>Purpose</th><th>Sales tip</th></tr></thead><tbody>${st.cadence.map(s=>`<tr><td>${s.d}</td><td>${CH[s.ch]}</td><td>${esc(s.purpose)}</td><td class="muted">${esc(s.tip)}</td></tr>`).join('')}</tbody></table></section>
 <section class="panel" style="margin-bottom:16px"><h2>First messages</h2>${Object.entries(st.messages).map(([ch,m])=>`<h3 style="margin-top:10px">${CH[ch]}</h3><textarea class="rmsg" data-ch="${ch}" style="min-height:130px">${esc(m.first)}</textarea>`).join('')}</section>
 <section class="panel" style="margin-bottom:16px"><h2>Ask ${esc(S.aiName)} to change something</h2><div class="actions"><input class="in" id="r_change" style="flex:1;min-width:200px" placeholder="e.g. Drop Instagram, add cold calls. Make emails shorter."><button class="btn" id="rethink">Rethink</button></div></section>
 <div class="actions"><button class="btn" id="wizback">Back</button><button class="btn primary" id="launch">${S.user==='hadi'?'Launch campaign':'Send to Hadi for approval'}</button></div>`;
}

function vScore(){
 const rows=Object.keys(PEOPLE).map(u=>{const w=S.week[u];return `<tr><td><strong>${first(u)}</strong></td><td>${pct(u)}%</td><td>${w.sends}</td><td>${w.replies}</td><td>${(w.replies/w.sends*100).toFixed(1)}%</td><td>${w.meetings}</td><td>${S.streak[u]} days</td></tr>`}).join('');
 const agg={};S.campaigns.forEach(c=>Object.entries(c.stats||{}).forEach(([k,x])=>{agg[k]=agg[k]||{s:0,r:0};agg[k].s+=x.s;agg[k].r+=x.r}));
 const trend=[1.4,2.1,2.6,3.1];
 return `<h1>Scoreboard</h1><p class="sub">What the Monday review runs on.</p>
 <div class="panel tablewrap" style="margin-bottom:16px"><table><thead><tr><th>Person</th><th>Today</th><th>Sends this week</th><th>Replies</th><th>Reply rate</th><th>Meetings</th><th>Streak</th></tr></thead><tbody>${rows}</tbody></table></div>
 <div class="grid g2"><section class="panel"><h2>Reply rate by channel</h2><div class="hbars">${Object.entries(agg).map(([k,x])=>`<div class="hb"><span>${CH[k].split(' ')[0]}</span><div class="bar" style="margin:0"><i style="width:${Math.min(100,x.s?x.r/x.s*800:0)}%"></i></div><span class="muted">${x.s?(x.r/x.s*100).toFixed(1):0}%</span></div>`).join('')}</div></section>
 <section class="panel"><h2>Team reply rate, last 4 weeks</h2><div class="hbars">${trend.map((v,i)=>`<div class="hb"><span>Week ${i+1}</span><div class="bar" style="margin:0"><i class="${i===3?'done':''}" style="width:${v*20}%"></i></div><span class="muted">${v}%</span></div>`).join('')}</div><p class="muted small" style="margin:8px 0 0">Proof the work compounds, even on quiet days.</p></section></div>`;
}

function vDebrief(){
 const u=S.user,t=S.targets[u],d=S.done[u],closed=S.closed[u];
 return `<h1>Close out</h1><p class="sub">Two minutes. Then you're done.</p>
 ${voice(`${pct(u)}% of targets today, ${first(u)}. ${d.replies||0} ${d.replies===1?'reply':'replies'}, ${d.meetings||0} meetings booked. Tell me what got in the way and I'll write the summary for Hadi.`)}
 <div class="grid g2"><section class="panel"><h2>Today vs targets</h2>${Object.keys(t).map(k=>`<div class="row"><span>${LABEL[k]}</span><span style="color:${(d[k]||0)>=t[k]?'var(--go)':'var(--muted)'}">${d[k]||0} / ${t[k]}</span></div>`).join('')}</section>
 <section class="panel"><h2>Debrief</h2><span class="lbl">What blocked you?</span><textarea id="blk" style="min-height:70px;margin:4px 0 10px"></textarea><span class="lbl">One thing you learned</span><textarea id="lrn" style="min-height:70px;margin-top:4px"></textarea><div class="actions" style="margin-top:10px"><button class="btn primary" id="close" ${closed?'disabled':''}>${closed?'Day closed':'Close out my day'}</button></div></section></div>
 <div id="sumout" style="margin-top:20px">${closed?voice(closed,'s'):''}</div>`;
}

function dealFlags(d){
 const f=[],i=stageIdx(d.stage);if(!OPEN.includes(d.stage))return f;
 const ds=daysSince(d.lastTouch);
 if(ds>=7)f.push(`Gone quiet ${ds} days`);else if(ds>=4)f.push(`${ds} days since last touch`);
 if(!d.nextStep&&i>=1)f.push('No next step booked');
 if(!d.nextStep&&i===0&&ds<1)f.push('Fresh reply, answer within the hour');
 if(i>=2&&d.people.some(p=>/decide|sign|final/i.test(p.role)&&!p.met))f.push('Decision-maker not met');
 if(i>=3&&!d.checks.decisionDate)f.push('No decision date');
 return f;
}
function health(d){
 if(d.stage==='won')return 100;if(d.stage==='lost')return 0;
 const i=stageIdx(d.stage);let tot=0,done=0;
 STAGES.slice(0,i+1).forEach((s,j)=>s.checks.forEach(([k])=>{const w=j===i?1:1.5;tot+=w;if(d.checks[k])done+=w}));
 const flags=dealFlags(d).filter(x=>!/answer within/.test(x));
 return Math.max(5,Math.min(100,Math.round(done/tot*100)-flags.length*12));
}
function hcolor(h){return h>=70?'var(--go)':h>=45?'var(--signal)':'var(--stop)'}
function allReviews(owner){const r=[];S.deals.filter(d=>!owner||d.owner===owner).forEach(d=>d.timeline.forEach(t=>{if(t.review)r.push(Object.assign({deal:d},t))}));return r}
function patterns(owner){
 const rs=allReviews(owner),c={};rs.forEach(r=>(r.review.tags||[]).forEach(t=>c[t]=(c[t]||0)+1));
 const bad=Object.entries(c).filter(([t])=>!GOODTAGS.includes(t)).sort((a,b)=>b[1]-a[1]),good=Object.entries(c).filter(([t])=>GOODTAGS.includes(t)).sort((a,b)=>b[1]-a[1]);
 const avg=rs.length?(rs.reduce((a,r)=>a+r.review.score,0)/rs.length).toFixed(1):null;
 return{rs,bad,good,avg};
}
function patternLine(owner){
 const p=patterns(owner),n=first(owner);if(!p.rs.length)return `No reviewed conversations yet, ${n}. Paste your next call notes into a deal and I'll start learning how you sell.`;
 let s=`${p.rs.length} of your conversations reviewed so far, average ${p.avg} out of 10.`;
 if(p.bad[0])s+=`\nYour most repeated mistake: ${p.bad[0][0].toLowerCase()} (${p.bad[0][1]} times). ${coachLine(p.bad[0][0])}`;
 if(p.good[0])s+=`\nKeep doing: ${p.good[0][0].toLowerCase()}. It's in your best deal.`;
 return s;
}
function coachLine(tag){return({'No next step':'Rule for this week: no call ends without a date on the calendar.','Pitched too early':'Rule for this week: three questions about their problem before you describe anything.','Weak price handling':'Rule for this week: say the price out loud, then stop talking and ask how it compares to their cost.','No recap of pain':'Rule for this week: every proposal opens with their problem in their words.','Missed decision-maker':'Rule for this week: ask "who else needs to be comfortable with this?" on every first call.','Did not quantify impact':'Rule for this week: get one number from them on every discovery call.','Slow follow-up':'Rule for this week: follow up within 24 hours, and every follow-up adds something new.','Talked too much':'Rule for this week: if you have talked for 60 seconds, ask a question.','Weak objection handling':'Rule for this week: acknowledge, ask what is behind it, then answer.'})[tag]||''}

function stagePrep(d){

  interested:{goal:`Turn ${who}'s interest into a booked 15-minute discovery call. Not a sale, not a price debate.`,openWith:`Answer exactly what they asked in one line, then ask one easy question and offer two call times.`,questions:[r?'How busy do Friday and Saturday nights get on the phone?':'How are guest messages handled today, especially at night?','Would Tuesday at 3pm or Wednesday at 11am work for 15 minutes?'],listenFor:['Short replies mean busy, not uninterested. Keep yours short too.','Any mention of another person: they may not decide alone.'],askFor:'A specific time on the calendar.',redFlags:['Asking for a long document before any conversation','"Just send it over" with no time for a call']},
  discovery:{goal:`Understand ${who}'s problem well enough that they tell you why they need this. You talk 30%, they talk 70%.`,openWith:`"My goal today is to understand how you handle ${r?'calls during rush hour':'guest communication and house rules'} and see if there's even a fit. If there isn't, I'll tell you. Fair?"`,
   questions:r?['Walk me through a Friday night. Who picks up the phone?','Roughly how many calls go unanswered on a busy night?','What is a typical phone order worth?','What have you tried so far?','If this worked, who else would want a say?']:['How do guests reach you today, and who answers at 2am?','What happened with the warnings or complaints you mentioned?','How many listings are in the affected area, and what does one bring in a month?','What have you tried so far?','Who else would be involved in choosing a tool like this?'],
   listenFor:['Numbers: calls, orders, listings, dollars. Write them down, they go in the proposal.','Emotional words like chaos, nightmare, stressed. Repeat them back later.','Names of other people. Each one is a decision-maker until proven otherwise.'],
   askFor:'The next meeting, booked on the calendar before you hang up, with everyone who decides.',redFlags:['They cannot name a real problem','"Just send me pricing" before sharing anything','Only one person involved in a decision that clearly needs two']},
  demo:{goal:`Show only the parts that solve the pain ${who} described. Ten minutes of the right thing beats forty of everything.`,openWith:`"Last time you told me ${d.timeline.filter(t=>t.review).slice(-1)[0]?'about the problem you are facing':'what was hurting'}. I'll show you exactly how that gets handled, then we'll see if it's worth going further."`,

   listenFor:['Silence during the demo usually means confusion. Stop and ask.','"That\'s cool" is politeness. "Could it also do X for us" is buying interest.'],
   askFor:'A decision process: who, what they need to see, and by when. Book the proposal walkthrough.',redFlags:['Decision-maker skipped the demo','No questions from them at all','"Send a proposal and we will look" with no date']},
  proposal:{goal:`Walk ${who} through the proposal live and agree on a decision date.`,openWith:`"Before we look at numbers, let me recap what you told me, so you can check I got it right."`,
   questions:['Did I capture the problem correctly?','How does this compare to what the problem is costing you?','What would need to be true to start this month?','Who signs, and should they join us for 10 minutes?'],
   listenFor:['Pushback on price is often pushback on value. Go back to their numbers.','"We need to think" usually hides a specific concern. Ask what it is.'],askFor:'A decision date and the signer on the next call.',redFlags:['Proposal sent without a conversation','No date for a decision','The champion cannot get the signer to a call']},
  closing:{goal:'Remove the last obstacles and get a signature with a start date.',openWith:'"What is left between here and getting started?"',questions:['Is there anything in the terms that needs changing?','What start date works for your team?','Who needs to be at onboarding?'],listenFor:['New people appearing late: address them directly, fast.'],askFor:'Signature and a kickoff date.',redFlags:['Asking for discounts with no timeline','Going quiet after verbal yes']}
 };
 const p=P[d.stage]||P.discovery;p.objections=obj;return p;

const PR={};
function dealCtx(d){const c=camp(d.camp);return `DEAL: ${d.biz} (${d.contact}), product ${d.product}, stage ${d.stage}, owner ${first(d.owner)}.
People: ${JSON.stringify(d.people)}. Criteria met so far: ${JSON.stringify(Object.keys(d.checks).filter(k=>d.checks[k]))}. Next step: ${d.nextStep?d.nextStep.text:'none'}. Days since last touch: ${daysSince(d.lastTouch)}.
History: ${JSON.stringify(d.timeline.map(t=>({type:t.type,title:t.title,body:t.body.slice(0,900),score:t.review&&t.review.score})))}
${c?knowledge(c).slice(0,6000):''}`}
function basicReview(text,type){
 const q=(text.match(/\?/g)||[]).length,words=text.split(/\s+/).length,tags=[],mistakes=[],well=[];
 const next=/(monday|tuesday|wednesday|thursday|friday|tomorrow|next week|\d{1,2}(am|pm)|booked|calendar)/i.test(text);
 if(next){tags.push('Next step booked');well.push('A specific next step appears to be set')}else{tags.push('No next step');mistakes.push({what:'No clear next step',why:'Without a date, the deal depends on them remembering you.',fix:'End with a specific time for the next conversation.'})}
 if(/send (you )?(some )?info|let me know if/i.test(text)){mistakes.push({what:'Handed control to them',why:'"Let me know" puts the next move in their hands.',fix:'Replace it with a specific ask and a time.'})}
 if(type==='call'&&!/(cost|worth|\$|per month|lose|lost|how many)/i.test(text)){tags.push('Did not quantify impact');mistakes.push({what:'No numbers captured',why:'Without a cost of the problem, price has nothing to compare against.',fix:'Ask what the problem costs them, in money or time.'})}
 if(/(husband|wife|partner|owner|boss|manager|team)/i.test(text))well.push('Another stakeholder was mentioned. Make sure they are in the next conversation.');
 const score=Math.max(2,Math.min(9,5+(next?2:-1)-mistakes.length+(q>2?1:0)));
 return{score,verdict:'Quick rule-based check. Open this on claude.ai for a full review.',wentWell:well,mistakes,missed:[],tags,basic:true,checksMet:next?['next']:[]};
}
async function reviewConversation(d,type,title,text){
 const prompt=`${persona()}
You are reviewing a real sales conversation like a demanding but fair sales manager coaching a beginner. Judge against proven B2B practice for small-business sales: discovery before pitching, the prospect talks more, quantify the problem, find every decision-maker, handle price by tying it to their cost, never end without a dated next step, follow up fast with something new.
${dealCtx(d)}

NEW ${type==='call'?'CONVERSATION':type==='in'?'MESSAGE FROM THE PROSPECT':'MESSAGE THE REP SENT'} (${title}):
${text.slice(0,8000)}

Return ONLY JSON: {"score":1-10,"verdict":"one or two blunt sentences","wentWell":["specific things"],"mistakes":[{"what":"","why":"why it hurts this deal specifically","fix":"exact words or action for next time"}],"missed":["facts the rep still does not know"],"tags":[subset of ${JSON.stringify(TAGS)}],"checksMet":[keys from ${JSON.stringify(STAGES.flatMap(s=>s.checks.map(c=>c[0])))} that are now clearly true],"stage":"one of ${JSON.stringify(STAGES.map(s=>s.k))} if the deal clearly moved, else current","nextStep":"the single next best action, specific, with timing","suggested":"the exact next message to send, written like a real person, or empty","signals":{"intent":"High|Medium|Low|Unclear","urgency":"High|Medium|Low|Unclear","sentiment":"Positive|Neutral|Negative|Unclear","note":"one sentence on what the prospect is really signalling, based only on evidence"}}
If it is the prospect's message, score how well the deal is progressing and focus on how to respond. Be specific to this deal. Never invent facts.`;
 const r=await aiJSON(prompt);
 if(!r)return basicReview(text,type);
 r.score=Math.max(1,Math.min(10,parseInt(r.score)||5));['wentWell','mistakes','missed','tags','checksMet'].forEach(k=>{if(!Array.isArray(r[k]))r[k]=[]});
 r.tags=r.tags.filter(t=>TAGS.includes(t));return r;
}

  if(o==='interested'){l.status='interested';S.done[u].replies++;S.done[u].meetings++;S.week[u].replies++;S.week[u].meetings++;c.stats[st.ch].r++;c.meetings++;c.notes.push({by:u,at:Date.now(),text:`${l.biz} is interested (via ${CH[st.ch]}).`});if(!S.deals.some(x=>x.biz===l.biz))S.deals.push({id:uid('D'),biz:l.biz,contact:l.contact,product:prodOf(c).name,owner:u,camp:c.id,stage:'interested',lastTouch:Date.now(),nextStep:null,checks:{replied:1,fit:1},people:[{name:(l.contact.split(',')[0]||'Contact'),role:(l.contact.split(',')[1]||'').trim()||'Contact',met:false}],nba:'Reply within the hour. Answer what they asked in one line, then book a 15-minute discovery call.',timeline:[{id:uid('t'),type:'in',channel:st.ch,title:`Interested via ${CH[st.ch]}`,at:Date.now(),body:'Marked interested in focus mode. Paste their actual message into Debrief for a full read.'}]});toast('New deal',`${l.biz} moved to Deals. Paste their message into Debrief and I'll coach the next move.`)}
  if(o==='dead'){l.status='dead';toast('Closed out',`${l.biz} marked not a fit. A clear no beats an endless maybe.`)}
  render();return}
 if(b.dataset.approve||b.dataset.reject){const id=b.dataset.approve||b.dataset.reject,idx=S.inbox.findIndex(x=>x.id===id),it=S.inbox[idx];S.inbox.splice(idx,1);
  if(b.dataset.approve){const nl={id:uid('L'),biz:it.biz,contact:it.contact||'Owner unknown',city:it.city,camp:it.camp,sig:it.sig,step:0};S.leads.push(nl);S.done[S.user].leads++;toast('Approved',`${it.biz} is in your queue. First touch: ${CH[sequence(nl)[0].ch]}.`)}
  else toast('Rejected',`${it.biz} removed. Clean lists win.`);render();return}
 if(b.id==='import'){const lines=$('#csv').value.split('\n').map(x=>x.trim()).filter(Boolean);let n=0;const y=v=>/^y/i.test(v||'');
  lines.forEach(line=>{const p=line.split(',').map(x=>x.trim());if(p.length<4||!camp(p[3]))return;S.inbox.push({id:uid('I'),biz:p[0],contact:p[1],city:p[2],camp:p[3],sig:{email:y(p[4]),ig:y(p[5]),li:y(p[6]),phone:y(p[7])},source:'Import'});n++});
  toast(n?'Imported':'Nothing imported',n?`${n} leads added and scored.`:'Check the columns and campaign id.');render();return}
 if(b.id==='close'){const u=S.user,p=pct(u),blk=$('#blk').value,lrn=$('#lrn').value;if(p>=80)S.streak[u]++;else S.streak[u]=0;b.disabled=true;$('#sumout').innerHTML=voice('','s');
  const fb=`${first(u)} closed at ${p}% of targets. ${S.done[u].replies} replies, ${S.done[u].meetings} meetings. Blocker: ${blk||'none noted'}. Learned: ${lrn||'nothing noted'}.`;
  S.closed[u]=await stream('s',`${persona()}\nWrite an end-of-day summary for Hadi (CSO) about ${first(u)} in 3 to 4 sentences, then one sentence of honest coaching for tomorrow. Data: ${JSON.stringify({pct:p,targets:S.targets[u],done:S.done[u],blocker:blk,learned:lrn,streak:S.streak[u]})}`,fb);save();rail();return}
 if(b.dataset.approvecamp||b.dataset.resume){const c=camp(b.dataset.approvecamp||b.dataset.resume);c.status='active';c.notes.push({by:'hadi',at:Date.now(),text:b.dataset.resume?'Resumed.':'Approved and launched.'});toast('Live',`${c.name} is live. Leads for it will appear in ${first(c.owner)}'s inbox.`);render();return}
 if(b.dataset.pause){const c=camp(b.dataset.pause);c.status='paused';c.notes.push({by:'hadi',at:Date.now(),text:'Paused.'});render();return}
 if(b.id==='savemsgs'){const c=camp(S.openCamp);document.querySelectorAll('.msg').forEach(t=>{c.strategy.messages[t.dataset.ch][t.dataset.k]=t.value});c.notes.push({by:S.user,at:Date.now(),text:'Updated campaign messages.'});toast('Saved','Focus mode now uses the new messages.');render();return}
 if(b.id==='addcampdoc'){const c=camp(S.openCamp);const files=await readFiles($('#campfile'));const note=$('#campnote').value.trim();if(note)files.push({id:uid('d'),name:`Note ${new Date().toLocaleDateString()}`,text:note});if(!files.length)return;c.docs=(c.docs||[]).concat(files);c.notes.push({by:S.user,at:Date.now(),text:`Added ${files.length} item${files.length>1?'s':''} to campaign knowledge.`});toast('Added',`${S.aiName} will use this when drafting and coaching.`);render();return}
 if(b.id==='addlog'){const c=camp(S.openCamp),v=$('#lognote').value.trim();if(!v)return;c.notes.push({by:S.user,at:Date.now(),text:v});render();return}
 if(b.dataset.pickprod){W.productId=b.dataset.pickprod;render();return}
 if(b.id==='wiz1'){if(W.productId==='new'){W.newProd={name:$('#np_name').value.trim(),type:$('#np_type').value,summary:$('#np_sum').value.trim()};if(!W.newProd.name||!W.newProd.summary){toast('Almost','Give it a name and a plain description so '+S.aiName+' has something to work with.');return}}
  const files=await readFiles($('#wizfile'));const paste=$('#wizpaste').value.trim();if(paste)files.push({id:uid('d'),name:'Pasted notes',text:paste.slice(0,40000)});W.docs=W.docs.concat(files);W.step=2;render();return}
 if(b.id==='wizback'){W.step=W.step===4?2:1;render();return}
 if(b.id==='wiz2'){W.audience=$('#w_aud').value.trim();W.location=$('#w_loc').value.trim();W.goal=$('#w_goal').value.trim();W.owner=$('#w_owner').value;W.notes=$('#w_notes').value.trim();buildStrategy();return}
 if(b.id==='rethink'){const v=$('#r_change').value.trim();if(!v)return;syncReview();buildStrategy(v);return}
 if(b.id==='launch'){syncReview();let pid=W.productId;
  if(pid==='new'){pid=uid('p');S.products.push({id:pid,name:W.newProd.name,type:W.newProd.type,summary:W.newProd.summary,docs:W.docs})}else if(W.docs.length){const p=S.products.find(x=>x.id===pid);p.docs=p.docs.concat(W.docs)}
  const id='c'+(S.campaigns.length+1)+Math.random().toString(36).slice(2,4);const isHadi=S.user==='hadi';
  S.campaigns.push({id,productId:pid,name:W.name,city:W.strategy.icp.location,owner:W.owner,status:isHadi?'active':'pending',stats:{},meetings:0,bounce:0,goal:W.goal,createdAt:Date.now(),strategy:W.strategy,docs:[],notes:[{by:S.user,at:Date.now(),text:isHadi?'Created and launched.':'Created and sent to Hadi for approval.'},{by:'jarvis',at:Date.now(),text:`Strategy built: ${W.strategy.channels.map(x=>CH[x.ch]).join(', ')}; ${W.strategy.cadence.length}-touch cadence.`}]});
  toast(isHadi?'Campaign live':'Sent for approval',isHadi?'Copy the lead-gen job into OpenClaw to start filling the inbox.':'Hadi will see it on his Today screen.');W=null;S.openCamp=id;S.tab=isHadi?'icp':'overview';S.view='camp';render();window.scrollTo(0,0);return}
});
function syncReview(){if(!W||W.step!==4)return;const n=$('#r_name');if(n)W.name=n.value.trim()||W.name;const l=$('#r_loc');if(l){W.strategy.icp.location=l.value.trim();W.location=l.value.trim()}const s=$('#r_sum');if(s)W.strategy.summary=s.value;document.querySelectorAll('.rmsg').forEach(t=>{W.strategy.messages[t.dataset.ch].first=t.value})}
document.addEventListener('change',e=>{if(e.target.id==='whoSel'||e.target.id==='whoSel2'){S.user=e.target.value;render()}if(e.target.id==='aiName'){S.aiName=e.target.value.trim()||'Jarvis';render()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='chatin'){e.preventDefault();$('#sendchat').click()}});
render();
</script>
</body>
