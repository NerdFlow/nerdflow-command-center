name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: |
          npx prisma generate
          npm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -eu
            cd /var/www/products/salesAI
            git fetch origin main
            git reset --hard origin/main
            npm ci

            # Backup before migrations - if this fails, the deploy stops here
            # (set -eu + script_stop: true) and migrate deploy never runs.
            # Loads DIRECT_URL etc. from the project's own .env.
            set -a
            . ./.env
            set +a
            mkdir -p backups
            BACKUP_FILE="backups/pre-migrate-$(date +%Y%m%d%H%M%S).dump"
            pg_dump "$DIRECT_URL" --format=custom --no-owner --no-acl --file="$BACKUP_FILE"
            echo "Backup written to $BACKUP_FILE ($(du -h "$BACKUP_FILE" | cut -f1))"
            # Keep the last 20 backups only, so this can't grow unbounded.
            ls -t backups/pre-migrate-*.dump 2>/dev/null | tail -n +21 | xargs -r rm --
            # Restore with: pg_restore --clean --if-exists --no-owner --no-acl -d "$DIRECT_URL" backups/<file>.dump

            npx prisma migrate deploy
            npm run build
            if [ "$(id -u)" -eq 0 ]; then
              systemctl restart salesai
            else
              sudo systemctl restart salesai
            fi
            systemctl is-active salesai || sudo systemctl is-active salesai
