name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: |
          npx prisma generate
          npm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -eu
            cd /var/www/products/salesAI
            git fetch origin main
            git reset --hard origin/main
            npm ci

            # Cap the app's own connection pool. Without this, the persistent
            # app process alone can hold most/all of Supabase's session-mode
            # pooler limit (as low as 15 total client connections), leaving no
            # room for the backup/migrate connections below - this is exactly
            # why every deploy since the pooler switch has failed silently.
            if grep -q '^DATABASE_URL=' .env && ! grep '^DATABASE_URL=' .env | grep -q 'connection_limit='; then
              if grep '^DATABASE_URL=' .env | grep -q '?'; then
                sed -i.bak 's|^DATABASE_URL="\(.*\)"$|DATABASE_URL="\1\&connection_limit=5"|' .env
              else
                sed -i.bak 's|^DATABASE_URL="\(.*\)"$|DATABASE_URL="\1?connection_limit=5"|' .env
              fi
              echo "Patched DATABASE_URL with connection_limit=5"
            fi

            # Ensure CRON_SECRET is present so /api/cron/lead-gen can
            # validate the scheduled GitHub Actions workflow's Authorization
            # header. Idempotent: only appends if missing or empty.
            if ! grep -q '^CRON_SECRET=.\+' .env 2>/dev/null; then
              sed -i.bak '/^CRON_SECRET=/d' .env
              echo 'CRON_SECRET=${{ secrets.CRON_SECRET }}' >> .env
              echo "Added CRON_SECRET to .env"
            fi

            # Sales Pipeline bot bearer token. Same rule as CRON_SECRET:
            # write it only when the VPS line is missing or empty. Add the
            # GitHub Actions secret FOCUS_INGEST_SECRET before the first deploy
            # that should turn the ingest API on. See docs/FOCUS_INGEST_API.md.
            if ! grep -q '^FOCUS_INGEST_SECRET=.\+' .env 2>/dev/null; then
              sed -i.bak '/^FOCUS_INGEST_SECRET=/d' .env
              echo 'FOCUS_INGEST_SECRET=${{ secrets.FOCUS_INGEST_SECRET }}' >> .env
              echo "Added FOCUS_INGEST_SECRET to .env"
            fi

            # Restart now, before backup/migrate, so the *old* process (which
            # may already be holding a full pool of connections) releases them
            # first. Restarting again at the end (after build) picks up the
            # new code - two restarts this one time, one thereafter.
            if [ "$(id -u)" -eq 0 ]; then systemctl restart salesai; else sudo systemctl restart salesai; fi
            sleep 3

            # pg_dump refuses to dump from a server newer than itself (a real
            # version check, not a flag to work around) - Supabase runs
            # Postgres 17, so make sure a 17.x client is actually installed
            # before relying on it. Idempotent: no-ops once 17 is present.
            export DEBIAN_FRONTEND=noninteractive
            PG_DUMP=pg_dump
            if [ -x /usr/lib/postgresql/17/bin/pg_dump ]; then
              PG_DUMP=/usr/lib/postgresql/17/bin/pg_dump
            elif ! pg_dump --version 2>/dev/null | grep -q ' 17\.'; then
              echo "Installing postgresql-client-17 from apt.postgresql.org..."
              SUDO=""; [ "$(id -u)" -eq 0 ] || SUDO=sudo
              $SUDO apt-get update -y
              $SUDO apt-get install -y curl gnupg lsb-release ca-certificates
              $SUDO install -d /usr/share/postgresql-common/pgdg
              $SUDO curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
              echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | $SUDO tee /etc/apt/sources.list.d/pgdg.list
              $SUDO apt-get update -y
              $SUDO apt-get install -y postgresql-client-17
              if [ -x /usr/lib/postgresql/17/bin/pg_dump ]; then PG_DUMP=/usr/lib/postgresql/17/bin/pg_dump; fi
            fi
            echo "Using: $($PG_DUMP --version)"

            # Backup before migrations - if this fails, the deploy stops here
            # (set -eu + script_stop: true) and migrate deploy never runs.
            # Loads DIRECT_URL etc. from the project's own .env.
            set -a
            . ./.env
            set +a
            mkdir -p backups
            BACKUP_FILE="backups/pre-migrate-$(date +%Y%m%d%H%M%S).dump"
            "$PG_DUMP" "$DIRECT_URL" --format=custom --no-owner --no-acl --file="$BACKUP_FILE"
            echo "Backup written to $BACKUP_FILE ($(du -h "$BACKUP_FILE" | cut -f1))"
            # Keep the last 20 backups only, so this can't grow unbounded.
            ls -t backups/pre-migrate-*.dump 2>/dev/null | tail -n +21 | xargs -r rm --
            # Restore with: pg_restore --clean --if-exists --no-owner --no-acl -d "$DIRECT_URL" backups/<file>.dump

            npx prisma migrate deploy

            # Outreach KB only. Do not run `npm run seed` here: that upserts demo users and leads.
            # tsx is a production dependency so this still runs if npm ci omits devDependencies.
            # A failure is logged and the app still restarts. Existing rows are never
            # overwritten. The row count is the line
            # "Outreach knowledge base loaded: created N, skipped existing M ...".
            if npm run seed:outreach-kb; then
              echo "Outreach KB step finished"
            else
              echo "ERROR: Outreach KB load failed. Deploy will continue and salesai will still restart."
            fi

            npm run build
            if [ "$(id -u)" -eq 0 ]; then
              systemctl restart salesai
            else
              sudo systemctl restart salesai
            fi
            systemctl is-active salesai || sudo systemctl is-active salesai
