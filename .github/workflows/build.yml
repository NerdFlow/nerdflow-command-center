name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # Confirms main compiles. The VPS build uses the .env already on the server.
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
          DIRECT_URL: postgresql://build:build@127.0.0.1:5432/build
          NEXT_PUBLIC_APP_URL: https://sales.nerdflow.cloud
          NEXTAUTH_URL: https://sales.nerdflow.cloud
          NEXTAUTH_SECRET: ci-build-placeholder
          AI_PROVIDER: gemini
        run: |
          npx prisma generate
          npm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -eu
            cd /var/www/products/salesAI
            git fetch origin main
            git reset --hard origin/main
            npm ci
            npx prisma migrate deploy
            npm run build
            if [ "$(id -u)" -eq 0 ]; then
              systemctl restart salesai
            else
              sudo systemctl restart salesai
            fi
            systemctl is-active salesai || sudo systemctl is-active salesai
