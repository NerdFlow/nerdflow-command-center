services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: flow
      POSTGRES_PASSWORD: flow
      POSTGRES_DB: flow_command_center
    ports:
      - "5432:5432"
    volumes:
      - flow_pg_data:/var/lib/postgresql/data

volumes:
  flow_pg_data:
